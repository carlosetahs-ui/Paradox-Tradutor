# Copie este exemplo para config.toml NA RAIZ do projeto e ajuste.
# Sua configuração local não entra no Git.
# Caminhos relativos partem desta pasta. No Windows, use aspas simples nos caminhos.
# Para Europa Universalis IV, use examples/config.eu4.toml.
# Comandos na raiz, depois de copiar e ajustar config.toml:
# python ck2tr.py translate --config config.toml   # traduz os mods configurados; reaproveita o cache.
# python ck2tr.py check --config config.toml   # confere estrutura, códigos e arquivos da tradução.
# python ck2tr.py scan --config config.toml   # analisa os arquivos originais sem traduzir nem gravar.
#
# Outros comandos:
# python ck2tr.py status --config config.toml   # mostra o que está no cache e quanto falta; sem tradução.
# python ck2tr.py verify --config config.toml   # faz a mesma verificação de check.
# python ck2tr.py diff --config config.toml   # mostra original e tradução nas linhas com avisos.
# python ck2tr.py diff --config config.toml --find "trecho ou chave"   # procura esse texto na chave, original ou tradução.
# python ck2tr.py terms --config config.toml   # gera sugestões de nomes para preservar no keep.
# python ck2tr.py terms --config config.toml --min-count 3   # sugere nomes com pelo menos 3 ocorrências.
# python ck2tr.py package --config config.toml   # verifica e gera ZIP da tradução; exige overlay.
#
# Opções de execução (os exemplos podem ser combinados quando compatíveis):
# python ck2tr.py translate --config config.toml --limit 30   # traduz só os primeiros 30 textos únicos de cada mod.
# python ck2tr.py translate --config config.toml --mod "parte do nome"   # seleciona os mods cujo nome contém esse trecho.
# python ck2tr.py translate --config config.toml --backend echo   # testa o fluxo sem traduzir; acrescenta PT>.
# python ck2tr.py translate --config config.toml --backend argos   # usa Argos nesta execução; exige pacote instalado.
# python ck2tr.py status --config config.toml --backend argos   # consulta o que falta para Argos sem carregar o motor.
# python ck2tr.py translate --config config.toml --mode overlay   # gera mod separado, preservando o original.
# python ck2tr.py translate --config config.toml --mode inplace   # altera o original e cria backup; uso exclusivo do CK2.
# python ck2tr.py check --config config.toml --mode inplace   # compara o original alterado com o backup do CK2.
# python ck2tr.py diff --config config.toml --mode inplace   # mostra diferenças entre o backup e o CK2 alterado.
#
# Ferramentas e ajuda:
# python ck2tr.py argos-setup   # baixa e instala o pacote en -> pt do Argos; uma vez.
# python glossario_do_cache.py data/cache/cache.sqlite --min 4 --out saida   # gera keep/glossário sugeridos; revise antes de usar.
# python ck2tr.py --help   # lista os comandos disponíveis.
# python ck2tr.py translate --help   # mostra as opções; substitua translate por outro comando.
# python ck2tr.py --version   # mostra a versão instalada.
# python -m ck2translator translate --config config.toml   # entrada alternativa, equivalente a ck2tr.py.
# ck2tr translate --config config.toml   # mesmo comando após instalar o projeto com pip.
# ck2-glossario data/cache/cache.sqlite --min 4 --out saida   # atalho instalado da ferramenta glossario_do_cache.py.
#
# --config: escolhe o TOML; caminhos relativos partem da pasta desse arquivo.
# --mod também funciona com scan, status, check, verify, terms, diff e package.
# --backend existe em translate e status: translators | google | argos | ollama | openai | echo.
# --mode existe em translate, check, verify e diff; EU4 aceita somente overlay.
# --limit vale apenas para translate; --find apenas para diff; --min-count apenas para terms.
# --limit reconstrói a saída dessa execução; para a tradução completa, rode sem --limit.
# --min e --out acima pertencem à ferramenta de glossário (frequência mínima e pasta de saída).

[game]
id = "ck2"                 # opcional: configurações sem [game] continuam usando CK2

[model]
# translators | google | argos | ollama | openai | echo
# Instalação: python -m pip install -e ".[translators]"
backend = "translators"

# Serviços online: pausas e limites globais de pedidos.
providers = ["google", "bing", "alibaba", "yandex"]
source_lang = "en"
target_lang = "pt"
max_per_minute = 20          # 0 desativa este limite
max_per_hour = 600          # 0 desativa este limite
pause_min = 1.5
pause_max = 4.0
long_pause_every = 80        # 0 desativa a pausa longa
long_pause_min = 40
long_pause_max = 90
cooldown = 600
max_retries = 4
backoff_base = 15
max_chars = 3000

# Usados por ollama/openai. LM Studio: http://localhost:1234/v1
name = "qwen2.5:7b-instruct"
host = "http://localhost:11434"
temperature = 0.2
timeout = 180
# api_key = ""              # somente openai; não versione credenciais
# long_pause = 30           # duração da pausa longa do backend google

[translate]
source_column = "english"
# Selecione no jogo um dos idiomas abaixo para ler a tradução em português.
write_columns = ["english"]
mode = "overlay"            # mod separado; inplace altera o original com backup
output_dir = "saida"
cache = "data/cache/cache.sqlite"
reuse_cache_from = "auto"   # ou ["google", "argos", "ollama"]; [] desativa
workers = 1                 # serviços online compartilham o limitador de pedidos
safety = "strict"           # normal | strict | paranoid (pula textos com códigos)
skip_files = []             # aceita padrões, ex.: ["*_baronies.csv"]
context = "Fantasia medieval em um mod para Crusader Kings II."

# Aceitam um caminho, lista de caminhos ou "" para desativar.
keep_file = "data/terms/keep.txt"
glossary_file = "data/terms/glossary.txt"
replace_file = "data/terms/substituicoes.txt"
ptbr_fix = true

[[mods]]
name = "A Game of Thrones"   # nome EXATO do descritor original
path = 'mods/a game of thrones'
# mod_file = 'mods/A Game of Thrones.mod'  # opcional, usado se name não for informado

# [[mods]]
# name = "Outro Mod"
# path = 'D:\SteamLibrary\steamapps\workshop\content\203770\1234567890'

# Termos opcionais somados aos arquivos; o glossário do arquivo vence conflitos.
[glossary]
# Maester = "Meistre"

[keep]
