# Copie este exemplo para config.eu4.toml NA RAIZ do projeto e ajuste [[mods]].
# Caminhos relativos partem desta pasta; no Windows, use aspas simples nos caminhos.
# Comandos na raiz, depois de copiar e ajustar config.eu4.toml:
# python ck2tr.py translate --config config.eu4.toml   # traduz os mods configurados; reaproveita o cache.
# python ck2tr.py check --config config.eu4.toml   # confere estrutura, códigos e arquivos da tradução.
# python ck2tr.py scan --config config.eu4.toml   # analisa os arquivos originais sem traduzir nem gravar.
#
# Outros comandos:
# python ck2tr.py status --config config.eu4.toml   # mostra o que está no cache e quanto falta; sem tradução.
# python ck2tr.py verify --config config.eu4.toml   # faz a mesma verificação de check.
# python ck2tr.py diff --config config.eu4.toml   # mostra original e tradução nas linhas com avisos.
# python ck2tr.py diff --config config.eu4.toml --find "trecho ou chave"   # procura esse texto na chave, original ou tradução.
# python ck2tr.py terms --config config.eu4.toml   # gera sugestões de nomes para preservar no keep.
# python ck2tr.py terms --config config.eu4.toml --min-count 3   # sugere nomes com pelo menos 3 ocorrências.
# python ck2tr.py package --config config.eu4.toml   # verifica e gera ZIP da tradução; exige overlay.
#
# Opções de execução (os exemplos podem ser combinados quando compatíveis):
# python ck2tr.py translate --config config.eu4.toml --limit 30   # traduz só os primeiros 30 textos únicos de cada mod.
# python ck2tr.py translate --config config.eu4.toml --mod "parte do nome"   # seleciona os mods cujo nome contém esse trecho.
# python ck2tr.py translate --config config.eu4.toml --backend echo   # testa o fluxo sem traduzir; acrescenta PT>.
# python ck2tr.py translate --config config.eu4.toml --backend argos   # usa Argos nesta execução; exige pacote instalado.
# python ck2tr.py status --config config.eu4.toml --backend argos   # consulta o que falta para Argos sem carregar o motor.
# python ck2tr.py translate --config config.eu4.toml --mode overlay   # gera mod separado, preservando o original.
#
# Ferramentas e ajuda:
# python ck2tr.py argos-setup   # baixa e instala o pacote en -> pt do Argos; uma vez.
# python glossario_do_cache.py data/cache/cache.sqlite --min 4 --out saida_eu4   # gera keep/glossário sugeridos; revise antes de usar.
# python ck2tr.py --help   # lista os comandos disponíveis.
# python ck2tr.py translate --help   # mostra as opções; substitua translate por outro comando.
# python ck2tr.py --version   # mostra a versão instalada.
# python -m ck2translator translate --config config.eu4.toml   # entrada alternativa, equivalente a ck2tr.py.
# ck2tr translate --config config.eu4.toml   # mesmo comando após instalar o projeto com pip.
# ck2-glossario data/cache/cache.sqlite --min 4 --out saida_eu4   # atalho instalado da ferramenta glossario_do_cache.py.
#
# --config: escolhe o TOML; caminhos relativos partem da pasta desse arquivo.
# --mod também funciona com scan, status, check, verify, terms, diff e package.
# --backend existe em translate e status: translators | google | argos | ollama | openai | echo.
# --mode existe em translate, check, verify e diff; EU4 aceita somente overlay.
# --limit vale apenas para translate; --find apenas para diff; --min-count apenas para terms.
# --limit reconstrói a saída dessa execução; para a tradução completa, rode sem --limit.
# --min e --out acima pertencem à ferramenta de glossário (frequência mínima e pasta de saída).

[game]
id = "eu4"
# Opcional: a versão compatível que você verificou no jogo; não é preenchida automaticamente.
# supported_version = "1.xx.*" # substitua xx pela versão do seu jogo

[model]
# Troque o valor de backend e descomente só as opções do backend escolhido.
backend = "echo"
source_lang = "en"           # translators, google e argos
target_lang = "pt"

# translators: python -m pip install -e ".[translators]"
# Limites compartilhados pelos workers. Zero desativa o limite ou a pausa longa.
# providers = ["google", "bing", "alibaba", "yandex"]
# max_per_minute = 20
# max_per_hour = 600
# pause_min = 1.5
# pause_max = 4.0
# long_pause_every = 80
# long_pause_min = 40
# long_pause_max = 90
# cooldown = 600
# max_retries = 4
# backoff_base = 15
# max_chars = 3000
# timeout = 30               # em segundos para operações de rede

# google: python -m pip install -e ".[google]"
# pause_min = 1.0
# pause_max = 2.0
# long_pause_every = 100
# long_pause = 30
# timeout = 30               # em segundos para operações de rede

# argos: python -m pip install -e ".[argos]"
# Rode python ck2tr.py argos-setup uma vez para baixar o pacote en -> pt.

# ollama: inicie o servidor e use o nome exato do modelo instalado.
# name = "qwen2.5:7b-instruct"
# host = "http://localhost:11434"
# temperature = 0.2
# timeout = 180               # em segundos para operações de rede

# openai: inicie o servidor compatível. Exemplo para LM Studio.
# name = "id-do-modelo-no-servidor"
# host = "http://localhost:1234/v1"
# temperature = 0.2
# timeout = 180
# api_key = ""                # se o servidor exigir, preencha só no TOML local
# Ollama e OpenAI compatível exigem HTTPS fora desta máquina.

# echo: acrescenta "PT> " para testar a geração de arquivos sem rede.

[translate]
# EU4 usa um idioma nativo para exibir PT-BR. Cabeçalho e nome do YML são preservados.
# source_column e write_columns devem indicar o mesmo idioma. Selecione inglês no jogo.
source_column = "english"
write_columns = ["english"]
mode = "overlay"           # obrigatório no EU4: gera um mod separado
output_dir = "saida_eu4"
cache = "data/cache/cache.sqlite" # pode compartilhar o banco CK2; chaves separadas por jogo
reuse_cache_from = "auto"  # reaproveita outros backends dentro do mesmo perfil
workers = 1                 # comece com um worker para serviços online
safety = "strict"          # normal | strict | paranoid
skip_files = []            # padrões, ex.: ["*_l_french.yml", "replace/*"]
context = "Mod histórico de Europa Universalis IV."

# Para usar seus próprios termos no EU4, indique um arquivo ou uma lista de arquivos.
keep_file = ""
glossary_file = ""
replace_file = ""
ptbr_fix = true

[[mods]]
name = "Meu Mod EU4"       # nome EXATO do descritor original, usado como dependência
path = 'mods/meu_mod_eu4'  # pasta que contém localisation e, normalmente, descriptor.mod
# Sem name, tenta obter o nome de descriptor.mod. Também aceita um descritor explícito:
# mod_file = 'mods/meu_mod_eu4.mod'

[glossary]
# "Trade Power" = "Poder comercial"

[keep]
# terms = ["Habsburg"]
