name: Testes

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Executar testes offline
        run: python -m unittest discover -v
      - name: Conferir entrada do programa
        run: python -m ck2translator --version
